name: Deploy Web Preview

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate web platform scaffolding (only if missing)
        run: |
          if [ ! -d web ]; then
            flutter create --platforms=web .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        id: run_tests
        run: |
          set +e
          flutter test --reporter=expanded > test_output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat test_output.txt

      - name: Show test output as annotations (diagnostics)
        if: always() && steps.run_tests.outputs.exit_code != '0'
        run: |
          grep -inE "error|exception|unhandled|failed|Expected|Actual" test_output.txt | head -60 > relevant.txt || true
          if [ ! -s relevant.txt ]; then
            tail -n 60 test_output.txt > relevant.txt
          fi
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "::error::${line:0:400}"
          done < relevant.txt

      - name: Fail build if tests failed
        if: steps.run_tests.outputs.exit_code != '0'
        run: exit 1

      - name: Build web release
        run: flutter build web --release --base-href /spraytattoo_katalog/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
